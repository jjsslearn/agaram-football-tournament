<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Matchday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0A0E17;
    --bg-hero:#0B1220;
    --panel:#111726;
    --panel-alt:#0D1220;
    --border:#212A3B;
    --green:#22D07A;
    --green-dim:#17A85F;
    --amber:#F2A93B;
    --red:#EF4444;
    --white:#F5F7FA;
    --muted:#8C96A6;
    --muted-2:#5C6675;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--white); font-family:'Inter',sans-serif; min-height:100vh;}
  .app{max-width:1000px;margin:0 auto;padding-bottom:60px;}
  ::placeholder{color:var(--muted-2);}
  a{color:inherit;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:center;
    padding:14px 18px; border-bottom:1px solid var(--border);
    background:var(--bg); position:sticky; top:0; z-index:20; flex-wrap:wrap; gap:16px; position:relative;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-dim));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .brand-name{font-weight:700; font-size:14px; letter-spacing:.03em; text-transform:uppercase; border:none; background:transparent; color:var(--white); outline:none; font-family:'Inter',sans-serif; max-width:220px;}
  .brand-tag{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--green); font-weight:700;}

  .cat-pill{display:flex; border:1px solid var(--border); border-radius:20px; overflow:hidden;}
  .cat-pill button{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.05em; padding:6px 14px; background:transparent; color:var(--muted); border:none; cursor:pointer;}
  .cat-pill button.active{background:var(--green); color:#04140B;}

  .topbar-right{display:flex; align-items:center; gap:10px; position:absolute; right:18px; top:50%; transform:translateY(-50%);}
  .org-toggle{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; background:transparent; color:var(--muted); border:1px solid var(--border); padding:7px 12px; border-radius:20px; cursor:pointer; white-space:nowrap;}
  .org-toggle.active{background:var(--amber); color:#2B1B00; border-color:var(--amber); font-weight:700;}

  /* ---------- NAV ---------- */
  .navbar{display:flex; gap:4px; padding:0 18px; background:var(--bg); border-bottom:1px solid var(--border); overflow-x:auto; justify-content:center;}
  .navlink{font-family:'Inter',sans-serif; font-weight:600; font-size:13px; letter-spacing:.02em; text-transform:uppercase; color:var(--muted); background:transparent; border:none; padding:12px 14px; cursor:pointer; white-space:nowrap; border-radius:6px 6px 0 0;}
  .navlink.active{background:var(--green); color:#04140B;}
  .navlink .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  main{padding:22px 18px 10px;}

  /* ---------- HOME HERO ---------- */
  .hero{padding:34px 0 26px; border-bottom:1px solid var(--border); margin-bottom:30px; position:relative; text-align:center;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--green); font-weight:700; margin:0 0 14px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .eyebrow::after{content:"";width:30px;height:1px;background:var(--green);}
  .eyebrow::before{content:"";width:30px;height:1px;background:var(--green);}
  .headline{font-family:'Playfair Display',serif; font-weight:800; font-size:clamp(30px,6vw,52px); line-height:1.08; margin:0 0 6px;}
  .headline .l1{color:var(--white); display:block;}
  .headline .l2{color:var(--green); display:block;}
  .headline .l3{color:var(--amber); display:block; font-size:0.62em; margin-top:4px;}
  .hero input.editable{border:none; background:transparent; outline:none; font:inherit; color:inherit; width:100%; padding:0;}
  .stat-chips{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; justify-content:center;}
  .stat-chip{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 18px; min-width:84px;}
  .stat-chip .num{font-family:'Playfair Display',serif; font-weight:800; font-size:26px; color:var(--green);}
  .stat-chip .lbl{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:2px;}

  .slideshow{position:relative; margin-top:26px; border-radius:10px; overflow:hidden; border:1px solid var(--border); aspect-ratio:16/9; width:100%; background:#000;}
  .slideshow img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .8s ease;}
  .slideshow img.active{opacity:1;}
  .slideshow-dots{position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:6px;}
  .slideshow-dots span{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35);}
  .slideshow-dots span.active{background:var(--amber);}
  .photo-chip{display:flex; align-items:center; gap:8px; background:var(--panel-alt); border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin-bottom:6px; font-size:12px;}
  .photo-chip img{width:36px; height:36px; object-fit:cover; border-radius:4px; flex-shrink:0;}
  .photo-chip span{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted);}
  .photo-chip button{background:none; border:none; color:var(--red); cursor:pointer; font-size:15px; line-height:1;}

  .section-head{margin:36px 0 16px; text-align:center;}
  .section-head .eyebrow{margin-bottom:8px;}
  .section-head h2{font-family:'Playfair Display',serif; font-weight:800; font-size:26px; margin:0; color:var(--white);}

  .grounds-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
  .ground-card{background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--green); border-radius:8px; padding:16px;}
  .ground-card h4{margin:0 0 6px; font-size:16px; font-weight:700;}
  .ground-card p{margin:0; font-size:13px; color:var(--muted);}
  .ground-card input{background:transparent; border:none; outline:none; color:var(--muted); font-size:13px; width:100%; font-family:'Inter',sans-serif; padding:0;}

  .clubs-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
  .club-chip{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:11px 12px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px;}
  .club-chip .num{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted-2); font-weight:700;}
  .club-chip .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

  /* ---------- FILTER CHIPS ---------- */
  .filter-row{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .filter-chip{font-family:'Inter',sans-serif; font-size:12px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; padding:8px 14px; border-radius:20px; background:var(--panel); border:1px solid var(--border); color:var(--muted); cursor:pointer;}
  .filter-chip.active{background:var(--green); color:#04140B; border-color:var(--green);}

  /* ---------- MATCH ROW ---------- */
  .court-title{font-family:'Playfair Display',serif; font-weight:800; font-size:16px; margin:22px 0 10px; color:var(--white); display:flex; align-items:center; gap:8px;}
  .court-title .n{color:var(--green);}
  .fx-row{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px 18px; margin-bottom:10px; position:relative;}
  .fx-row.is-live{border-color:var(--red); box-shadow:0 0 0 1px var(--red) inset;}
  .fx-top{display:flex; justify-content:space-between; align-items:center; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted-2); margin-bottom:12px; flex-wrap:wrap; gap:6px;}
  .fx-code{color:var(--muted-2);}
  .fx-badge{font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:2px 9px; border-radius:20px; font-size:10px;}
  .fx-badge.live{background:var(--red); color:#fff;}
  .fx-badge.scheduled{background:var(--border); color:var(--muted);}
  .fx-badge.finished{background:var(--green); color:#04140B;}
  .fx-badge.postponed{background:#2A2F3A; color:var(--muted-2);}
  .fx-teams{display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .fx-team{flex:1; font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; color:var(--white);}
  .fx-team.muted{color:var(--muted);}
  .fx-team.right{justify-content:flex-end; text-align:right;}
  .fx-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
  .fx-score{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:var(--green); background:var(--panel-alt); border:1px solid var(--border); padding:5px 14px; border-radius:6px; min-width:70px; text-align:center;}
  .fx-vs{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:#2B1B00; background:var(--amber); padding:5px 12px; border-radius:6px;}
  .fx-meta-line{display:flex; gap:14px; margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); flex-wrap:wrap;}
  .fx-meta-line .green{color:var(--green);}

  .goals-list{display:flex; justify-content:space-between; gap:14px; margin-top:10px; font-size:11.5px; color:var(--muted);}
  .goals-list .side{display:flex; flex-direction:column; gap:2px;}
  .goals-list .side.right{text-align:right; margin-left:auto;}
  .goals-list b{color:var(--white);}

  .advance-note{margin-top:10px; background:#1A1508; border:1px solid #3D3010; border-radius:8px; padding:8px 12px; font-size:12px; color:var(--amber);}

  .empty{text-align:center; padding:36px 16px; color:var(--muted); font-size:14px; border:1px dashed var(--border); border-radius:8px; background:var(--panel);}

  /* ---------- BRACKET ---------- */
  .bracket-wrap{overflow-x:auto; padding:10px 4px 20px;}
  .bracket-columns{display:flex; gap:56px; position:relative; min-width:fit-content; padding:10px 30px;}
  .bracket-col{display:flex; flex-direction:column; justify-content:space-around; gap:28px; min-width:190px;}
  .bracket-match{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:9px 11px; position:relative; z-index:1;}
  .bracket-match .status{font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted-2); margin-bottom:5px;}
  .bracket-team{display:flex; justify-content:space-between; align-items:center; padding:3px 0; gap:8px; font-size:12.5px; color:var(--muted);}
  .bracket-team.winner{font-weight:700; color:var(--white);}
  .bracket-score{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--green); font-size:12px;}
  svg.bracket-lines{position:absolute; top:0; left:0; z-index:0; pointer-events:none;}

  /* ---------- STATS ---------- */
  .stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media(max-width:720px){.stats-grid{grid-template-columns:1fr;}}
  .stat-panel{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px;}
  .stat-panel-label{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); font-weight:700; margin-bottom:8px;}
  .total-goals-num{font-family:'Playfair Display',serif; font-weight:900; font-size:56px; color:var(--green); line-height:1;}
  .total-goals-sub{font-size:12px; color:var(--muted); margin-top:6px; margin-bottom:18px;}
  .goal-bar-row{margin-bottom:10px;}
  .goal-bar-row .lbl{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .goal-bar-row .lbl b{color:var(--white);}
  .goal-bar-track{height:5px; background:var(--border); border-radius:3px; overflow:hidden;}
  .goal-bar-fill{height:100%; background:var(--green);}

  .standing-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
  .standing-row:last-child{border-bottom:none;}
  .standing-rank{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--muted-2); width:20px;}
  .standing-name{font-weight:700; flex:1;}
  .standing-record{font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
  .standing-pts{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--green); font-size:15px;}

  .scorers-table{width:100%; border-collapse:collapse; margin-top:14px; font-size:13px;}
  .scorers-table th{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; text-align:left; color:var(--muted); padding:8px 6px; border-bottom:1px solid var(--border);}
  .scorers-table td{padding:10px 6px; border-bottom:1px solid var(--border);}
  .scorers-table tr:last-child td{border-bottom:none;}
  .scorers-table td.goals{color:var(--green); font-weight:700; font-family:'JetBrains Mono',monospace;}
  .scorers-table tr.top td{color:var(--amber); font-weight:700;}

  /* ---------- ORGANIZER ---------- */
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:16px;}
  .panel h3{font-family:'Playfair Display',serif; font-size:17px; margin:0 0 14px; font-weight:800; text-align:center;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:5px;}
  .field input, .field select{width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; font-family:'Inter',sans-serif; background:var(--panel-alt); color:var(--white);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .btn{font-family:'Inter',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:12px; background:var(--green); color:#04140B; border:none; padding:10px 16px; border-radius:6px; cursor:pointer;}
  .btn:hover{background:var(--green-dim);}
  .btn.secondary{background:transparent; color:var(--green); border:1px solid var(--green);}
  .btn.danger{background:var(--red); color:#fff;}
  .btn.amber{background:var(--amber); color:#2B1B00;}
  .btn.small{padding:7px 11px; font-size:11px;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}

  .team-chip{display:inline-flex; align-items:center; gap:6px; background:var(--panel-alt); border:1px solid var(--border); border-radius:20px; padding:5px 10px 5px 8px; font-size:12px; margin:0 6px 6px 0;}
  .team-chip button{background:none; border:none; color:var(--red); cursor:pointer; font-size:14px; line-height:1; padding:0;}

  .live-control{background:var(--panel-alt); border:2px solid #22D07A; border-radius:8px; padding:12px; margin-top:12px;}
  .goal-entry{display:flex; gap:6px; margin-bottom:6px;}
  .goal-entry input{flex:1; padding:8px 9px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:var(--bg); color:var(--white);}
  .goal-entry-label{font-size:10px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; color:var(--muted); margin-bottom:3px; letter-spacing:.05em;}
  .lock-screen{max-width:280px; margin:60px auto; text-align:center; padding:20px;}
  .lock-screen input{text-align:center; letter-spacing:.3em; font-family:'JetBrains Mono',monospace; font-size:18px;}
  .note{font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5;}
  .footer-note{text-align:center; font-size:11px; color:var(--muted-2); padding:24px; font-family:'JetBrains Mono',monospace; border-top:1px solid var(--border); margin-top:30px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const STORAGE_KEY = 'tournament-data-v3';
const COLORS = ['#22D07A','#EF4444','#F2A93B','#3B82F6','#A855F7','#06B6D4','#EC4899','#84CC16'];
const COURTS = ['Court A','Court B','Court C'];
const CATEGORIES = ['U16','U19'];

// ====== PASTE YOUR FIREBASE CONFIG HERE ======
const firebaseConfig = {
  apiKey: "AIzaSyBJG-GRavt9dKto_AKWpcer_qwPsG6KNWg",
  authDomain: "agaram-football-tournament.firebaseapp.com",
  databaseURL: "https://agaram-football-tournament-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "agaram-football-tournament",
  storageBucket: "agaram-football-tournament.firebasestorage.app",
  messagingSenderId: "498936179346",
  appId: "1:498936179346:web:add00181c7fb35764c544b"
};
// ==============================================
firebase.initializeApp(firebaseConfig);
const dataRef = firebase.database().ref(STORAGE_KEY);

let state = null;
let activeTab = 'home';
let selectedCategory = 'U16';
let orgMode = false;
let editingMatchId = null;
let unlocked = false;
let saving = false;
let scheduleFilter = 'ALL';
let resultsFilter = 'ALL';
let slideIndex = 0;
let slideTimer = null;

function defaultState(){
  return {
    config: {
      name: 'My Local Tournament',
      heroLine1: 'LOCAL FOOTBALL',
      heroLine2: 'MY TOURNAMENT',
      heroLine3: 'LOCAL FOOTBALL TOURNAMENT',
      dateRange: '',
      passcode: '1234',
      nextMatchNumber: 1,
      courtDesc: { 'Court A':'', 'Court B':'', 'Court C':'' },
      photos: []
    },
    teams: [],
    matches: []
  };
}
function uid(){ return Math.random().toString(36).slice(2,9); }

async function loadState(){
  try{
    const snap = await dataRef.once('value');
    if(snap.exists()){ state = snap.val(); if(!state.config.courtDesc) state.config.courtDesc={'Court A':'','Court B':'','Court C':''}; }
    else { state = defaultState(); await persist(); }
  }catch(e){ console.error('load failed', e); state = defaultState(); }
    if(!Array.isArray(state.matches)) state.matches = [];
    if(!Array.isArray(state.teams)) state.teams = [];
    if(state && !state.config.photos) state.config.photos = [];
  render();
  dataRef.on('value', (snap)=>{
    if(!snap.exists()) return;
    const incoming = snap.val();
    if(!Array.isArray(incoming.matches)) incoming.matches = [];
    if(!Array.isArray(incoming.teams)) incoming.teams = [];
    const incomingStr = JSON.stringify(incoming);
    const current = JSON.stringify(state);
    if(incomingStr !== current){
      const active = document.activeElement;
      const isTyping = active && (active.tagName==='INPUT' || active.tagName==='SELECT');
      if(!isTyping){ state = incoming; render(); }
    }
  });
}
async function persist(){
  saving = true;
  try{ await dataRef.set(state); }
  catch(e){ console.error('save failed', e); }
  saving = false;
}
function teamById(id){ return (state.teams||[]).find(t=>t.id===id); }
function fmtDate(d){ if(!d) return ''; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function catMatches(){ return (state.matches||[]).filter(m=>m.category===selectedCategory); }
function catTeams(){ return (state.teams||[]).filter(t=>t.category===selectedCategory); }
function sortMatches(list){ return [...list].sort((a,b)=>((a.date||'9999')+(a.time||'99:99')).localeCompare((b.date||'9999')+(b.time||'99:99'))); }
function teamColor(t){ return t && t.color ? t.color : '#22D07A'; }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function computeStandings(teams, matches){
  const table = {};
  teams.forEach(t=> table[t.id] = {team:t, p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  matches.filter(m=>m.status==='finished').forEach(m=>{
    const h = table[m.home], a = table[m.away];
    if(!h||!a) return;
    h.p++; a.p++;
    h.gf += m.homeScore; h.ga += m.awayScore;
    a.gf += m.awayScore; a.ga += m.homeScore;
    if(m.homeScore > m.awayScore){ h.w++; h.pts+=3; a.l++; }
    else if(m.homeScore < m.awayScore){ a.w++; a.pts+=3; h.l++; }
    else { h.d++; a.d++; h.pts+=1; a.pts+=1; }
  });
  return Object.values(table).sort((x,y)=>{
    if(y.pts!==x.pts) return y.pts-x.pts;
    const gdx=x.gf-x.ga, gdy=y.gf-y.ga;
    if(gdy!==gdx) return gdy-gdx;
    return y.gf-x.gf;
  });
}
function getWinner(m){
  if(m.homeScore>m.awayScore) return 'home';
  if(m.awayScore>m.homeScore) return 'away';
  if(m.penaltyWinner) return m.penaltyWinner;
  return null;
}

/* ---------------- RENDER ---------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderTopbar());
  app.appendChild(renderNav());
  const main = document.createElement('main');
  if(activeTab==='home') main.appendChild(renderHome());
  else if(activeTab==='live') main.appendChild(renderLive());
  else if(activeTab==='schedule') main.appendChild(renderSchedule());

function startSlideshow(){
  if(slideTimer) clearInterval(slideTimer);
  const photos = state.config.photos || [];
  if(photos.length < 2) return;
  slideIndex = 0;
  slideTimer = setInterval(()=>{
    const el2 = document.getElementById('heroSlideshow');
    if(!el2 || !document.contains(el2)){ clearInterval(slideTimer); return; }
    const imgs = el2.querySelectorAll('img');
    const dots = el2.querySelectorAll('.slideshow-dots span');
    imgs[slideIndex].classList.remove('active');
    dots[slideIndex].classList.remove('active');
    slideIndex = (slideIndex + 1) % imgs.length;
    imgs[slideIndex].classList.add('active');
    dots[slideIndex].classList.add('active');
  }, 3500);
}

function statusLabel(m){
  if(m.status==='live') return m.minute ? `${m.minute}'` : 'Live';
  if(m.status==='finished') return 'Full time';
  if(m.status==='postponed') return 'Postponed';
  return 'Upcoming';
}
function fxRow(m, opts={}){
  const home = teamById(m.home), away = teamById(m.away);
  const isLive = m.status==='live';
  const isFinished = m.status==='finished';
  const winner = isFinished ? getWinner(m) : null;
  const card = el(`
    <div class="fx-row ${isLive?'is-live':''}">
      <div class="fx-top">
        <span class="fx-code">M${String(m.number).padStart(2,'0')}</span>
        <span class="fx-badge ${m.status}">${statusLabel(m)}</span>
      </div>
      <div class="fx-teams">
        <div class="fx-team ${winner==='away'?'muted':''}"><span class="fx-dot" style="background:${teamColor(home)}"></span>${home? escapeHtml(home.name) : (m.home==='TBD' ? 'TBD' : '—')}</div>
        ${isLive||isFinished ? `<div class="fx-score">${m.homeScore}<span style="opacity:.4">&nbsp;-&nbsp;</span>${m.awayScore}</div>` : `<div class="fx-vs">VS</div>`}
        <div class="fx-team right ${winner==='home'?'muted':''}">${away? escapeHtml(away.name) : (m.away==='TBD' ? 'TBD' : '—')}<span class="fx-dot" style="background:${teamColor(away)}"></span></div>
      </div>
      <div class="fx-meta-line">
        <span class="green">${escapeHtml(m.court||'')}</span>
        <span>${m.date? fmtDate(m.date):''}${m.time? ' · '+m.time:''}</span>
      </div>
      ${(m.goals && m.goals.length) ? `
      <div class="goals-list">
        <div class="side">${m.goals.filter(g=>g.side==='home').map(g=>`⚽ <b>${escapeHtml(g.player)}</b>${g.minute? ' '+g.minute+"'":''}`).join('<br>')}</div>
        <div class="side right">${m.goals.filter(g=>g.side==='away').map(g=>`⚽ <b>${escapeHtml(g.player)}</b>${g.minute? ' '+g.minute+"'":''}`).join('<br>')}</div>
      </div>` : ''}
      ${isFinished && m.advance && m.advance.targetMatchId ? (()=>{
        const wTeam = winner==='home'? home : winner==='away'? away : null;
        const target = (state.matches||[]).find(x=>x.id===m.advance.targetMatchId);
        return `<div class="advance-note">🏆 ${wTeam? escapeHtml(wTeam.name) : 'Winner'} advances → ${target? 'Match '+target.number+' ('+escapeHtml(target.court||'')+(target.time? ', '+target.time:'')+')' : 'a later match'}</div>`;
      })() : ''}
      <div class="control-slot"></div>
    </div>
  `);
  if(orgMode && opts.withControls){
    card.querySelector('.control-slot').appendChild(renderLiveControls(m));
  }
  return card;
}

function computeBracketRounds(matches){
  const round = {};
  matches.forEach(m=> round[m.id]=1);
  for(let pass=0; pass<15; pass++){
    matches.forEach(m=>{
      if(m.advance && m.advance.targetMatchId){
        const target = matches.find(x=>x.id===m.advance.targetMatchId);
        if(target && round[target.id] < round[m.id]+1) round[target.id] = round[m.id]+1;
      }
    });
  }
  return round;
}

function renderBracket(){
  const wrap = document.createElement('div');
  wrap.appendChild(el(`<div class="section-head"><div class="eyebrow">KNOCKOUT</div><h2>Bracket</h2></div>`));
  const matches = catMatches();
  if(matches.length===0){
    wrap.appendChild(el(`<div class="empty">No ${selectedCategory} fixtures yet.<br>Once matches are linked with 'Winner plays next in', the bracket draws itself here.</div>`));
    return wrap;
  }
  const roundMap = computeBracketRounds(matches);
  const maxRound = Math.max(...Object.values(roundMap));
  const outer = el(`<div class="bracket-wrap"><div class="bracket-columns" id="bracketColumns"></div></div>`);
  const colsWrap = outer.querySelector('#bracketColumns');
  colsWrap.style.position = 'relative';
  for(let r=1; r<=maxRound; r++){
    const colMatches = matches.filter(m=>roundMap[m.id]===r).sort((a,b)=>a.number-b.number);
    const colEl = el(`<div class="bracket-col"></div>`);
    colMatches.forEach(m=>{
      const home = teamById(m.home), away = teamById(m.away);
      const winner = m.status==='finished' ? getWinner(m) : null;
      const homeLabel = home ? home.name : (m.home==='TBD' ? 'TBD' : '—');
      const awayLabel = away ? away.name : (m.away==='TBD' ? 'TBD' : '—');
      const showScore = m.status==='live' || m.status==='finished';
      const card = el(`
        <div class="bracket-match" data-match-id="${m.id}">
          <div class="status">M${m.number} &middot; ${statusLabel(m)}</div>
          <div class="bracket-team ${winner==='home'?'winner':''}"><span>${escapeHtml(homeLabel)}</span>${showScore?`<span class="bracket-score">${m.homeScore}</span>`:''}</div>
          <div class="bracket-team ${winner==='away'?'winner':''}"><span>${escapeHtml(awayLabel)}</span>${showScore?`<span class="bracket-score">${m.awayScore}</span>`:''}</div>
        </div>
      `);
      colEl.appendChild(card);
    });
    colsWrap.appendChild(colEl);
  }
  wrap.appendChild(outer);
  setTimeout(()=> drawBracketConnectors(matches, colsWrap), 0);
  return wrap;
}

function drawBracketConnectors(matches, container){
  if(!document.contains(container)) return;
  const old = container.querySelector('svg.bracket-lines');
  if(old) old.remove();
  const rect = container.getBoundingClientRect();
  if(rect.width===0) return;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','bracket-lines');
  svg.setAttribute('width', rect.width);
  svg.setAttribute('height', rect.height);
  container.insertBefore(svg, container.firstChild);
  matches.forEach(m=>{
    if(!(m.advance && m.advance.targetMatchId)) return;
    const srcEl = container.querySelector(`[data-match-id="${m.id}"]`);
    const tgtEl = container.querySelector(`[data-match-id="${m.advance.targetMatchId}"]`);
    if(!srcEl || !tgtEl) return;
    const s = srcEl.getBoundingClientRect(), t = tgtEl.getBoundingClientRect();
    const x1 = s.right - rect.left, y1 = s.top + s.height/2 - rect.top;
    const x2 = t.left - rect.left;
    const y2 = (m.advance.slot==='away' ? t.top + t.height*0.75 : t.top + t.height*0.25) - rect.top;
    const midX = (x1+x2)/2;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`);
    path.setAttribute('stroke', '#2A3346');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('fill', 'none');
    svg.appendChild(path);
  });
}

function renderStats(){
  const wrap = document.createElement('div');
  wrap.appendChild(el(`<div class="section-head"><div class="eyebrow">TOURNAMENT STATISTICS</div><h2>Stats & Standings</h2></div>`));
  const teams = catTeams(), matches = catMatches();
  const finished = matches.filter(m=>m.status==='finished');
  let total = 0; const tally = {};
  matches.forEach(m=>{
    (m.goals||[]).forEach(g=>{
      total++;
      const teamId = g.side==='home'? m.home : m.away;
      const team = teamById(teamId);
      const key = g.player.trim().toLowerCase()+'|'+teamId;
      if(!tally[key]) tally[key] = {player:g.player, team, goals:0};
      tally[key].goals++;
    });
  });
  const byCourt = {};
  COURTS.forEach(c=> byCourt[c]=0);
  matches.forEach(m=> byCourt[m.court] = (byCourt[m.court]||0) + (m.goals? m.goals.length:0));
  const maxCourtGoals = Math.max(1, ...Object.values(byCourt));

  const grid = el(`<div class="stats-grid"></div>`);

  const leftPanel = el(`
    <div class="stat-panel">
      <div class="stat-panel-label">Total Goals</div>
      <div class="total-goals-num">${total}</div>
      <div class="total-goals-sub">across ${finished.length} finished match${finished.length!==1?'es':''} &middot; ${selectedCategory}</div>
      <div class="stat-panel-label" style="margin-top:6px;">Goals by court</div>
    </div>
  `);
  COURTS.forEach(c=>{
    const g = byCourt[c]||0;
    leftPanel.appendChild(el(`
      <div class="goal-bar-row">
        <div class="lbl"><span>${c}</span><b>${g}</b></div>
        <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${(g/maxCourtGoals*100)}%"></div></div>
      </div>
    `));
  });
  grid.appendChild(leftPanel);

  const rightPanel = el(`<div class="stat-panel"><div class="stat-panel-label">Final Standings</div></div>`);
  if(teams.length===0){
    rightPanel.appendChild(el(`<div class="note">Add teams to see standings.</div>`));
  } else {
    computeStandings(teams, matches).forEach((r,i)=>{
      rightPanel.appendChild(el(`
        <div class="standing-row">
          <span class="standing-rank">${i+1}</span>
          <span class="fx-dot" style="background:${teamColor(r.team)}"></span>
          <div style="flex:1;">
            <div class="standing-name">${escapeHtml(r.team.name)}</div>
            <div class="standing-record">${r.p}P &middot; ${r.w}W ${r.d}D ${r.l}L &middot; GD ${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</div>
          </div>
          <span class="standing-pts">${r.pts}</span>
        </div>
      `));
    });
  }
  grid.appendChild(rightPanel);
  wrap.appendChild(grid);

  wrap.appendChild(el(`<div class="section-head"><div class="eyebrow">GOLDEN BOOT RACE</div><h2>Top Scorers</h2></div>`));
  const ranked = Object.values(tally).sort((a,b)=>b.goals-a.goals);
  if(ranked.length===0){
    wrap.appendChild(el(`<div class="empty">No goals recorded yet for ${selectedCategory}.</div>`));
  } else {
    const tbl = el(`
      <div class="stat-panel">
        <table class="scorers-table">
          <thead><tr><th>#</th><th>Player</th><th>Club</th><th>Goals</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    `);
    const tbody = tbl.querySelector('tbody');
    ranked.forEach((r,i)=>{
      tbody.appendChild(el(`
        <tr class="${i<3?'top':''}">
          <td>${i+1}</td>
          <td>${escapeHtml(r.player)}</td>
          <td>${r.team? escapeHtml(r.team.name):''}</td>
          <td class="goals">${r.goals}</td>
        </tr>
      `));
    });
    wrap.appendChild(tbl);
  }
  return wrap;
}

        <div class="field"><label>Time</label><input type="time" id="mTime" /></div>
      </div>
      <button class="btn small" id="addMatchBtn">+ Add to schedule</button>
      `}
    </div>
  `);
  if(teamsForCat.length>=2){
    matchPanel.querySelector('#addMatchBtn').addEventListener('click', async ()=>{
      const home = matchPanel.querySelector('#homeSel').value;
      const away = matchPanel.querySelector('#awaySel').value;
      if(home===away && home!=='TBD'){ alert('Home and away team must be different.'); return; }
      const court = matchPanel.querySelector('#mCourt').value;
      const date = matchPanel.querySelector('#mDate').value;
      const time = matchPanel.querySelector('#mTime').value;
      const number = state.config.nextMatchNumber || 1;
      state.config.nextMatchNumber = number + 1;
      if(!Array.isArray(state.matches)) state.matches = [];
      state.matches.push({ id: uid(), number, category: selectedCategory, home, away, court, date, time, status:'scheduled', homeScore:0, awayScore:0, minute:'', goals:[], advance:{targetMatchId:'',slot:''}, penaltyWinner:null });
      await persist(); render();
    });
  }
  wrap.appendChild(matchPanel);

  const bulkPanel = el(`
    <div class="panel">
      <h3>Bulk add fixtures</h3>
      <p class="note" style="margin-top:0;">One match per line: <b>Home Team, Away Team, Court, Date, Time</b><br>
      Court, Date and Time are optional. If a team name doesn't already exist, it'll be created automatically.<br>
      Example:<br>
      SSVM Mettupalayam, Navabharath National, Court A, 2026-08-27, 09:00<br>
      GRD Public School, Bharatiya Vidya Bhavan, Court B, 2026-08-27, 10:00<br>
      Sri Sakthi International, Camford International</p>
      <div class="field"><label>Fixtures (one per line)</label>
        <textarea id="bulkText" rows="6" style="width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:'JetBrains Mono',monospace; background:var(--panel-alt); color:var(--white); resize:vertical;" placeholder="Home Team, Away Team, Court, Date, Time"></textarea>
      </div>
      <button class="btn small" id="bulkAddBtn">+ Add all fixtures</button>
    </div>
  `);
  bulkPanel.querySelector('#bulkAddBtn').addEventListener('click', async ()=>{
    const text = bulkPanel.querySelector('#bulkText').value;
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length===0){ alert('Paste at least one fixture line first.'); return; }
    if(!Array.isArray(state.teams)) state.teams = [];
    if(!Array.isArray(state.matches)) state.matches = [];

    const findOrCreateTeam = (name)=>{
      const clean = name.trim();
      if(clean.toUpperCase()==='TBD') return { id:'TBD', name:'TBD' };
      let t = state.teams.find(x=> x.category===selectedCategory && x.name.toLowerCase()===clean.toLowerCase());
      if(!t){
        t = { id: uid(), name: clean, category: selectedCategory, color: COLORS[state.teams.length % COLORS.length] };
        state.teams.push(t);
      }
      return t;
    };

    let added = 0, skipped = [];
    lines.forEach((line, idx)=>{
      const parts = line.split(',').map(s=>s.trim()).filter(p=>p.length>0);
      if(parts.length < 2){ skipped.push(`Line ${idx+1}: need at least Home, Away`); return; }
      const [homeName, awayName, courtRaw, date, time] = parts;
      if(homeName.toLowerCase() === awayName.toLowerCase()){ skipped.push(`Line ${idx+1}: home and away are the same`); return; }
      const home = findOrCreateTeam(homeName);
      const away = findOrCreateTeam(awayName);
      const court = COURTS.includes(courtRaw) ? courtRaw : COURTS[0];
      const number = state.config.nextMatchNumber || 1;
      state.config.nextMatchNumber = number + 1;
      state.matches.push({ id: uid(), number, category: selectedCategory, home: home.id, away: away.id, court, date: date||'', time: time||'', status:'scheduled', homeScore:0, awayScore:0, minute:'', goals:[], advance:{targetMatchId:'',slot:''}, penaltyWinner:null });
      added++;
    });

    await persist();
    bulkPanel.querySelector('#bulkText').value = '';
    render();
    alert(`Added ${added} fixture${added!==1?'s':''}.${skipped.length ? '\n\nSkipped:\n'+skipped.join('\n') : ''}`);
  });
  wrap.appendChild(bulkPanel);

  const unassignedTeams = (()=> {
    const usedIds = new Set();
    (state.matches||[]).forEach(m=>{ if(m.home && m.home!=='TBD') usedIds.add(m.home); if(m.away && m.away!=='TBD') usedIds.add(m.away); });
    return catTeams().filter(t=> !usedIds.has(t.id));
  })();
  const unlinkedMatches = catMatches().filter(m=> !(m.advance && m.advance.targetMatchId));

  const rbPanel = el(`
    <div class="panel">
      <h3>Bracket Round Builder</h3>
      <p class="note" style="margin-top:0;">Build your knockout round by round. Each side of a new match can be either a team waiting for its next game (a bye) or the winner of an existing match — pick "Winner of Match #" and it'll auto-fill once that match finishes. Use this for Round 1 too: with no matches yet, only real teams show up as options.</p>
      <p class="note"><b>Teams waiting for a match (${unassignedTeams.length}):</b> ${unassignedTeams.length ? unassignedTeams.map(t=>escapeHtml(t.name)).join(', ') : 'None — every team is already placed in a match.'}</p>
      <p class="note"><b>Matches not yet linked forward (${unlinkedMatches.length}):</b> ${unlinkedMatches.length ? unlinkedMatches.map(m=>'M'+m.number).join(', ') : 'None.'}</p>
      <div class="row2">
        <div class="field"><label>Home side</label><select id="rbHome"><option value="">— choose —</option>
          ${unassignedTeams.map(t=>`<option value="team:${t.id}">${escapeHtml(t.name)} (bye)</option>`).join('')}
          ${unlinkedMatches.map(m=>`<option value="match:${m.id}">Winner of Match ${m.number}</option>`).join('')}
        </select></div>
        <div class="field"><label>Away side</label><select id="rbAway"><option value="">— choose —</option>
          ${unassignedTeams.map(t=>`<option value="team:${t.id}">${escapeHtml(t.name)} (bye)</option>`).join('')}
          ${unlinkedMatches.map(m=>`<option value="match:${m.id}">Winner of Match ${m.number}</option>`).join('')}
        </select></div>
      </div>
      <div class="row3">
        <div class="field"><label>Court</label><select id="rbCourt">${COURTS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
        <div class="field"><label>Date</label><input type="date" id="rbDate" /></div>
        <div class="field"><label>Time</label><input type="time" id="rbTime" /></div>
      </div>
      <button class="btn small" id="rbAddBtn">+ Create this match</button>
    </div>
  `);
  rbPanel.querySelector('#rbAddBtn').addEventListener('click', async ()=>{
    const homeVal = rbPanel.querySelector('#rbHome').value;
    const awayVal = rbPanel.querySelector('#rbAway').value;
    if(!homeVal || !awayVal){ alert('Pick both a home side and an away side.'); return; }
    if(homeVal === awayVal){ alert('Home and away can\'t be the exact same team or match.'); return; }
    const court = rbPanel.querySelector('#rbCourt').value;
    const date = rbPanel.querySelector('#rbDate').value;
    const time = rbPanel.querySelector('#rbTime').value;
    const number = state.config.nextMatchNumber || 1;
    state.config.nextMatchNumber = number + 1;
    let home = 'TBD', away = 'TBD', homeLinkId = null, awayLinkId = null;
    if(homeVal.startsWith('team:')) home = homeVal.slice(5);
    else homeLinkId = homeVal.slice(6);
    if(awayVal.startsWith('team:')) away = awayVal.slice(5);
    else awayLinkId = awayVal.slice(6);
    if(!Array.isArray(state.matches)) state.matches = [];
    const newMatch = { id: uid(), number, category: selectedCategory, home, away, court, date, time, status:'scheduled', homeScore:0, awayScore:0, minute:'', goals:[], advance:{targetMatchId:'',slot:''}, penaltyWinner:null };
    state.matches.push(newMatch);
    if(homeLinkId){ const src = state.matches.find(x=>x.id===homeLinkId); if(src) src.advance = {targetMatchId:newMatch.id, slot:'home'}; }
    if(awayLinkId){ const src = state.matches.find(x=>x.id===awayLinkId); if(src) src.advance = {targetMatchId:newMatch.id, slot:'away'}; }
    await persist(); render();
  });
  wrap.appendChild(rbPanel);

  const manageWrap = el(`<div class="panel"><h3>Manage ${selectedCategory} matches</h3></div>`);
  const sorted = sortMatches(catMatches());
  if(sorted.length===0){ manageWrap.appendChild(el(`<p class="note">No matches yet.</p>`)); }
  else { sorted.forEach(m=> manageWrap.appendChild(fxRow(m,{withControls:true}))); }
  wrap.appendChild(manageWrap);

  const groundsPanel = el(`
    <div class="panel">
      <h3>Match Grounds</h3>
      <p class="note" style="margin-top:0;">These descriptions show under each court on the Home page.</p>
    </div>
  `);
  COURTS.forEach(c=>{
    const f = el(`<div class="field"><label>${c}</label><input value="${escapeAttr((state.config.courtDesc&&state.config.courtDesc[c])||'')}" placeholder="e.g. Opposite to main building." /></div>`);
    f.querySelector('input').addEventListener('change', async (e)=>{
      if(!state.config.courtDesc) state.config.courtDesc={};
      state.config.courtDesc[c] = e.target.value;
      await persist();
    });
    groundsPanel.appendChild(f);
  });
  wrap.appendChild(groundsPanel);

  const photosPanel = el(`
    <div class="panel">
      <h3>Home Page Photo Slideshow</h3>
      <p class="note" style="margin-top:0;">Paste a link to a photo already hosted online (e.g. from Google Photos "share" link, Imgur, or your school's site). Add a few and they'll auto-rotate on the Home page.</p>
      <div id="photoList"></div>
      <div class="field"><label>Photo URL</label><input id="newPhotoUrl" placeholder="https://..." /></div>
      <button class="btn small" id="addPhotoBtn">+ Add photo</button>
    </div>
  `);
  const photoListEl = photosPanel.querySelector('#photoList');
  (state.config.photos||[]).forEach((url,i)=>{
    const chip = el(`<div class="photo-chip"><img src="${escapeAttr(url)}" onerror="this.style.opacity=0.2" /><span>${escapeAttr(url)}</span><button title="remove">×</button></div>`);
    chip.querySelector('button').addEventListener('click', async ()=>{
      state.config.photos.splice(i,1);
      await persist(); render();
    });
    photoListEl.appendChild(chip);
  });
  photosPanel.querySelector('#addPhotoBtn').addEventListener('click', async ()=>{
    const input = photosPanel.querySelector('#newPhotoUrl');
    const url = input.value.trim();
    if(!url) return;
    if(!state.config.photos) state.config.photos = [];
    state.config.photos.push(url);
    await persist(); render();
  });
  wrap.appendChild(photosPanel);

  const settingsPanel = el(`
    <div class="panel">
      <h3>Settings</h3>
      <div class="field"><label>Tournament name</label><input id="nameInput" value="${escapeAttr(state.config.name||'')}" placeholder="e.g. Agaram Football Tournament" /></div>
      <div class="field"><label>Logo (single emoji, or an image URL)</label><input id="logoInput" value="${escapeAttr(state.config.logo||'')}" placeholder="⚽ or https://..." /></div>
      <div class="field"><label>Hero line 1 (white, top)</label><input id="heroLine1Input" value="${escapeAttr(state.config.heroLine1||'')}" placeholder="e.g. LOCAL FOOTBALL" /></div>
      <div class="field"><label>Hero line 2 (green, main)</label><input id="heroLine2Input" value="${escapeAttr(state.config.heroLine2||'')}" placeholder="e.g. AGARAM FOOTBALL TOURNAMENT" /></div>
      <div class="field"><label>Hero line 3 (amber, tagline)</label><input id="heroLine3Input" value="${escapeAttr(state.config.heroLine3||'')}" placeholder="e.g. INTER SCHOOL FOOTBALL" /></div>
      <div class="field"><label>Date range (shown on Home)</label><input id="dateRangeInput" value="${escapeAttr(state.config.dateRange||'')}" placeholder="e.g. 27-28 Aug 2026" /></div>
      <div class="field"><label>Organizer passcode</label><input id="pwChange" value="${escapeAttr(state.config.passcode)}" /></div>
      <div class="btn-row">
        <button class="btn secondary small" id="saveSettingsBtn">Save settings</button>
        <button class="btn danger small" id="resetBtn">Reset all tournament data</button>
      </div>
      <p class="note">Resetting clears every team and match, in both categories, for everyone viewing this page. This cannot be undone.</p>
    </div>
  `);
  settingsPanel.querySelector('#saveSettingsBtn').addEventListener('click', async ()=>{
    state.config.name = settingsPanel.querySelector('#nameInput').value.trim() || 'My Local Tournament';
    state.config.logo = settingsPanel.querySelector('#logoInput').value.trim();
    state.config.heroLine1 = settingsPanel.querySelector('#heroLine1Input').value.trim();
    state.config.heroLine2 = settingsPanel.querySelector('#heroLine2Input').value.trim();
    state.config.heroLine3 = settingsPanel.querySelector('#heroLine3Input').value.trim();
    state.config.dateRange = settingsPanel.querySelector('#dateRangeInput').value.trim();
    const pw = settingsPanel.querySelector('#pwChange').value.trim();
    if(pw) state.config.passcode = pw;
    await persist(); alert('Settings saved.'); render();
  });
  settingsPanel.querySelector('#resetBtn').addEventListener('click', async ()=>{
    if(confirm('Reset ALL teams and matches in both categories? This cannot be undone.')){
      state = defaultState(); await persist(); unlocked=false; render();
    }
  });
  wrap.appendChild(settingsPanel);

  return wrap;
}

function renderLiveControls(m){
  const wrap = el(`<div class="live-control"></div>`);
  if(!m.status || (m.status!=='live' && m.status!=='finished' && m.status!=='postponed')){
    m.status = 'scheduled';
  }
  if(!Array.isArray(m.goals)) m.goals = [];
  if(!m.advance) m.advance = {targetMatchId:'', slot:''};

  if(editingMatchId === m.id){
    const teamsForCat = catTeams();
    const editBox = el(`
      <div>
        <div class="row2">
          <div class="field" style="margin:0;"><label>Home team</label><select id="editHomeSel">${teamsForCat.map(t=>`<option value="${t.id}" ${t.id===m.home?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}<option value="TBD" ${m.home==='TBD'?'selected':''}>TBD</option></select></div>
          <div class="field" style="margin:0;"><label>Away team</label><select id="editAwaySel">${teamsForCat.map(t=>`<option value="${t.id}" ${t.id===m.away?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}<option value="TBD" ${m.away==='TBD'?'selected':''}>TBD</option></select></div>
        </div>
        <div class="row3" style="margin-top:8px;">
          <div class="field" style="margin:0;"><label>Court</label><select id="editCourt">${COURTS.map(c=>`<option value="${c}" ${c===m.court?'selected':''}>${c}</option>`).join('')}</select></div>
          <div class="field" style="margin:0;"><label>Date</label><input type="date" id="editDate" value="${escapeAttr(m.date||'')}" /></div>
          <div class="field" style="margin:0;"><label>Time</label><input type="time" id="editTime" value="${escapeAttr(m.time||'')}" /></div>
        </div>
        <div class="btn-row">
          <button class="btn small" id="saveEditBtn">Save changes</button>
          <button class="btn small secondary" id="cancelEditBtn">Cancel</button>
        </div>
      </div>
    `);
    editBox.querySelector('#saveEditBtn').addEventListener('click', async ()=>{
      const home = editBox.querySelector('#editHomeSel').value;
      const away = editBox.querySelector('#editAwaySel').value;
      if(home===away && home!=='TBD'){ alert('Home and away team must be different.'); return; }
      m.home = home; m.away = away;
      m.court = editBox.querySelector('#editCourt').value;
      m.date = editBox.querySelector('#editDate').value;
      m.time = editBox.querySelector('#editTime').value;
      editingMatchId = null;
      await persist(); render();
    });
    editBox.querySelector('#cancelEditBtn').addEventListener('click', ()=>{ editingMatchId = null; render(); });
    wrap.appendChild(editBox);
    return wrap;
  }

  if(m.status==='scheduled' || m.status==='postponed'){
    const row = el(`<div class="btn-row"></div>`);
    const startBtn = el(`<button class="btn" style="background:#22D07A;color:#04140B;width:100%;padding:12px;font-size:13px;">▶ Kick off</button>`);
    startBtn.addEventListener('click', async ()=>{ m.status='live'; m.minute='1'; await persist(); render(); });
    row.appendChild(startBtn);
    const editBtn = el(`<button class="btn small secondary">Edit</button>`);
    editBtn.addEventListener('click', ()=>{ editingMatchId = m.id; render(); });
    row.appendChild(editBtn);
    const pp = el(`<button class="btn small secondary">${m.status==='postponed'?'Un-postpone':'Postpone'}</button>`);
    pp.addEventListener('click', async ()=>{ m.status = m.status==='postponed' ? 'scheduled' : 'postponed'; await persist(); render(); });
    row.appendChild(pp);
    const delBtn = el(`<button class="btn small danger">Delete</button>`);
    delBtn.addEventListener('click', async ()=>{
      if(confirm(`Delete Match ${m.number}? This cannot be undone.`)){
        state.matches = (state.matches||[]).filter(x=>x.id!==m.id);
        await persist(); render();
      }
    });
    row.appendChild(delBtn);
    wrap.appendChild(row);
    return wrap;
  }
  if(m.status==='live'){
    const home = teamById(m.home), away = teamById(m.away);
    const box = el(`
      <div>
        <div class="goal-entry-label">Goal for ${home? escapeHtml(home.name):'Home'}</div>
        <div class="goal-entry"><input placeholder="Scorer name" id="homeScorer" /><button class="btn small">+ Goal</button></div>
        <div class="goal-entry-label">Goal for ${away? escapeHtml(away.name):'Away'}</div>
        <div class="goal-entry"><input placeholder="Scorer name" id="awayScorer" /><button class="btn small">+ Goal</button></div>
        <div class="row2" style="margin-top:6px;">
          <div class="field" style="margin:0;"><label>Minute</label><input type="text" value="${escapeAttr(m.minute||'')}" id="minuteInput" placeholder="e.g. 63" /></div>
          <div style="display:flex; align-items:flex-end;"><button class="btn small danger" style="width:100%;" id="ftBtn">Full time</button></div>
        </div>
      </div>
    `);
    const homeBtn = box.querySelectorAll('.goal-entry button')[0];
    const awayBtn = box.querySelectorAll('.goal-entry button')[1];
    homeBtn.addEventListener('click', async ()=>{
      const input = box.querySelector('#homeScorer');
      const player = input.value.trim() || 'Unknown';
      m.goals.push({side:'home', player, minute:m.minute||''});
      m.homeScore++;
      await persist(); render();
    });
    awayBtn.addEventListener('click', async ()=>{
      const input = box.querySelector('#awayScorer');
      const player = input.value.trim() || 'Unknown';
      m.goals.push({side:'away', player, minute:m.minute||''});
      m.awayScore++;
      await persist(); render();
    });
    box.querySelector('#minuteInput').addEventListener('change', async (e)=>{ m.minute = e.target.value; await persist(); });
    box.querySelector('#ftBtn').addEventListener('click', async ()=>{ m.status='finished'; await persist(); render(); });

    if(m.goals.length > 0){
      const goalsPanel = el(`<div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--border);"><div class="goal-entry-label">Goals scored — tap to fix a name or remove</div></div>`);
      m.goals.forEach((g, idx)=>{
        const gRow = el(`
          <div class="goal-entry">
            <span style="font-size:11px; color:var(--muted); width:34px; flex-shrink:0;">${g.side==='home'?'HOME':'AWAY'}</span>
            <input value="${escapeAttr(g.player)}" data-idx="${idx}" class="goalNameInput" />
            <button class="btn small danger" data-idx="${idx}" title="Remove this goal">×</button>
          </div>
        `);
        gRow.querySelector('.goalNameInput').addEventListener('change', async (e)=>{
          m.goals[idx].player = e.target.value.trim() || 'Unknown';
          await persist();
        });
        gRow.querySelector('button').addEventListener('click', async ()=>{
          if(confirm('Remove this goal? The score will be adjusted.')){
            const removed = m.goals[idx];
            if(removed.side==='home') m.homeScore = Math.max(0, m.homeScore-1);
            else m.awayScore = Math.max(0, m.awayScore-1);
            m.goals.splice(idx,1);
            await persist(); render();
          }
        });
        goalsPanel.appendChild(gRow);
      });
      box.appendChild(goalsPanel);
    }

    const editRow = el(`<div class="btn-row" style="margin-top:10px;"><button class="btn small secondary" id="editMatchBtn">Edit match details</button></div>`);
    editRow.querySelector('#editMatchBtn').addEventListener('click', ()=>{ editingMatchId = m.id; render(); });
    box.appendChild(editRow);

    wrap.appendChild(box);
    return wrap;
  }
  if(m.status==='finished'){
    const winner = getWinner(m);
    const box = el(`<div></div>`);
    if(winner===null){
      box.appendChild(el(`
        <div>
          <div class="btn-row" style="margin-bottom:6px;">
            <span class="note" style="margin:0;">Scores level — who advances?</span>
          </div>
          <div class="btn-row">
            <button class="btn small secondary" id="homeWonPen">${teamById(m.home)? escapeHtml(teamById(m.home).name):'Home'} wins on pens</button>
            <button class="btn small secondary" id="awayWonPen">${teamById(m.away)? escapeHtml(teamById(m.away).name):'Away'} wins on pens</button>
          </div>
        </div>
      `));
      box.querySelector('#homeWonPen').addEventListener('click', async ()=>{ m.penaltyWinner='home'; await persist(); render(); });
      box.querySelector('#awayWonPen').addEventListener('click', async ()=>{ m.penaltyWinner='away'; await persist(); render(); });
    }
    const otherMatches = catMatches().filter(x=>x.id!==m.id);
    const advBox = el(`
      <div style="margin-top:10px;">
        <div class="row2">
          <div class="field" style="margin:0;"><label>Winner plays next in</label><select id="advMatch"><option value="">— pick a match —</option>${otherMatches.map(x=>`<option value="${x.id}" ${m.advance&&m.advance.targetMatchId===x.id?'selected':''}>Match ${x.number} (${x.court}${x.time? ', '+x.time:''})</option>`).join('')}</select></div>
          <div class="field" style="margin:0;"><label>As</label><select id="advSlot"><option value="home" ${m.advance&&m.advance.slot==='home'?'selected':''}>Home team</option><option value="away" ${m.advance&&m.advance.slot==='away'?'selected':''}>Away team</option></select></div>
        </div>
        <p class="note" style="margin-top:4px;">Pick the match your winner plays next — it fills that slot automatically, replacing TBD.</p>
        <button class="btn small" id="saveAdvBtn" style="margin-top:8px;">Save & advance winner</button>
        <button class="btn small secondary" id="reopenBtn" style="margin-top:8px;">Reopen match</button>
        <button class="btn small secondary" id="editFinishedBtn" style="margin-top:8px;">Edit match details</button>
      </div>
    `);
    advBox.querySelector('#saveAdvBtn').addEventListener('click', async ()=>{
      const targetId = advBox.querySelector('#advMatch').value;
      const slot = advBox.querySelector('#advSlot').value;
      if(!targetId){ alert('Pick which match the winner advances to.'); return; }
      const w = getWinner(m);
      if(!w){ alert('Decide the winner first (see above).'); return; }
      const winnerTeamId = w==='home' ? m.home : m.away;
      const target = (state.matches||[]).find(x=>x.id===targetId);
      if(target){ target[slot] = winnerTeamId; }
      m.advance = { targetMatchId: targetId, slot };
      await persist(); render();
    });
    advBox.querySelector('#reopenBtn').addEventListener('click', async ()=>{ m.status='live'; await persist(); render(); });
    advBox.querySelector('#editFinishedBtn').addEventListener('click', ()=>{ editingMatchId = m.id; render(); });
    box.appendChild(advBox);
    wrap.appendChild(box);
  }
  return wrap;
}

loadState();
</script>
</body>
</html>
